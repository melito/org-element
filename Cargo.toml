[workspace]
members = ["org-element"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Mel Gray <melgray@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/melito/org-element"
keywords = ["org-mode", "parser", "ast", "emacs"]
categories = ["parser-implementations", "text-processing"]

[workspace.dependencies]
# Core parsing dependencies
tree-sitter = "0.20"
tree-sitter-org = "1.3.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Utilities
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
